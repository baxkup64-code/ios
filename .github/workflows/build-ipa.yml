name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Unsigned Archive bauen
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpotifyClone.xcodeproj \
            -scheme SpotifyClone \
            -configuration Release \
            -archivePath "$PWD/build/SpotifyClone.xcarchive" \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty || true

      - name: IPA packen (Payload-Struktur)
        run: |
          mkdir -p "$PWD/build/Payload"
          cp -r "$PWD/build/SpotifyClone.xcarchive/Products/Applications/SpotifyClone.app" "$PWD/build/Payload/"
          cd "$PWD/build" && zip -r SpotifyClone-unsigned.ipa Payload

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyClone-unsigned-ipa
          path: build/SpotifyClone-unsigned.ipa
          if-no-files-found: error
